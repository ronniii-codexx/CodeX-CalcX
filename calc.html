
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="calcstyle.css">
    

</head>

<body>

    <div class="calculator">

        <h2>Calculator</h2>

        <input type="text" class="display" value="0" readonly>

        <div class="buttons">

            <button class="clear">C</button>
            <button>⌫</button>
            <button>%</button>
            <button class="operator">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button>0</button>
            <button>00</button>
            <button>.</button>
            <button class="equal">=</button>

        </div>

    </div>

</body>
<script src="calc.js"></script>
</html>
